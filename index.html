<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nihongo Master - HP Friendly</title>
  <style>
    /* Reset & Base Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #FAF8FC; color: #4A4A68; padding-bottom: 30px; }

    /* Header & Navigation */
    header { background: #ffffff; padding: 12px 16px; border-bottom: 1px solid #E2D9F3; sticky: top; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .brand { font-weight: bold; font-size: 16px; color: #3B2863; margin-bottom: 10px; display: flex; items-center; gap: 8px; }
    
    .nav-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .nav-btn {
      flex: none; padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: bold; border: none; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .nav-btn:active { transform: scale(0.95); }
    
    /* Button Colors (Pastel) */
    .btn-pink { background: #FFD1DC; color: #5C2230; }
    .btn-blue { background: #A2D2FF; color: #1E3A5F; }
    .btn-mint { background: #BFFCC6; color: #1C4D25; }
    .btn-lavender { background: #C8B6FF; color: #3B2863; }
    .nav-btn.active { outline: 2px solid #A287F4; }

    /* Layout Content */
    main { padding: 16px; max-width: 500px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards */
    .card { background: #fff; border-radius: 16px; padding: 16px; border: 1px solid #E2D9F3; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    
    /* Interactive Flashcard */
    .flashcard {
      background: #ffffff; border: 2px solid #FFD1DC; border-radius: 20px; height: 220px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      padding: 16px; margin-bottom: 16px; cursor: pointer; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .flashcard .tag { position: absolute; top: 12px; background: #FFD1DC; color: #5C2230; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    .flashcard .main-text { font-size: 32px; font-weight: bold; margin: 10px 0 4px 0; color: #222; }
    .flashcard .sub-text { font-size: 16px; color: #F498AD; font-weight: bold; }
    .flashcard .hint { position: absolute; bottom: 10px; font-size: 10px; color: #8C8C9A; }

    /* Controls */
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .action-btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; }
    
    /* Inputs & Options */
    select, input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #CCC; margin-top: 6px; font-size: 13px; outline: none; }
    .option-btn {
      width: 100%; text-align: left; padding: 12px; border-radius: 12px; border: 1px solid #E2D9F3;
      background: #fff; margin-bottom: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .option-btn.correct { background: #BFFCC6; border-color: #83E891; color: #1C4D25; }
    .option-btn.wrong { background: #FFCBC1; border-color: #F498AD; color: #5C2230; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand">🌸 Nihongo Master (Mobile)</div>
    <div class="nav-container">
      <button id="nav-kotoba" onclick="switchTab('kotoba')" class="nav-btn btn-pink active">Kotoba</button>
      <button id="nav-kanji" onclick="switchTab('kanji')" class="nav-btn btn-blue">Kanji N4</button>
      <button id="nav-bunpou" onclick="switchTab('bunpou')" class="nav-btn btn-mint">Bunpou</button>
      <button id="nav-kuis" onclick="switchTab('kuis')" class="nav-btn btn-lavender">Kuis</button>
    </div>
  </header>

  <main>

    <!-- KOTOBA TAB -->
    <div id="tab-kotoba" class="tab-content active">
      <div class="card">
        <label style="font-size: 12px; font-weight: bold;">Pilih Bab:</label>
        <select id="kotoba-select" onchange="filterKotoba()"></select>
      </div>

      <div class="flashcard" id="kotoba-card-box" onclick="toggleKotobaCard()">
        <span class="tag" id="k-tag">Bab 26</span>
        <div id="k-front">
          <div class="main-text" id="k-kanji">診ます</div>
          <div class="sub-text" id="k-kana">みます</div>
        </div>
        <div id="k-back" class="hidden">
          <div class="main-text" style="font-size:20px;" id="k-arti">memeriksa kesehatan</div>
          <div class="sub-text" style="font-size:12px; color:#666;" id="k-contoh">医者に診てもらいます</div>
        </div>
        <div class="hint">💡 Ketuk kartu untuk pembalik jawaban</div>
      </div>

      <div class="controls">
        <button onclick="prevKotoba()" class="action-btn btn-pink">◀ Kiri</button>
        <span id="k-counter" style="font-size:12px; font-weight:bold;">1 / 10</span>
        <button onclick="nextKotoba()" class="action-btn btn-pink">Kanan ▶</button>
      </div>
    </div>


    <!-- KANJI TAB -->
    <div id="tab-kanji" class="tab-content">
      <div class="flashcard" style="border-color:#A2D2FF;" onclick="toggleKanjiCard()">
        <span class="tag" style="background:#A2D2FF; color:#1E3A5F;" id="kj-strokes">13 Coretan</span>
        <div id="kj-front">
          <div class="main-text" style="font-size:60px;" id="kj-char">新</div>
        </div>
        <div id="kj-back" class="hidden">
          <div class="main-text" style="font-size:20px;" id="kj-arti">Baru (New)</div>
          <div style="font-size:12px; text-align:left; margin-top:8px;">
            <p><strong>Onyomi:</strong> <span id="kj-onyomi">シン</span></p>
            <p><strong>Kunyomi:</strong> <span id="kj-kunyomi">あたら.しい</span></p>
            <p><strong>Contoh:</strong> <span id="kj-ex">新聞 (しんぶん)</span></p>
          </div>
        </div>
        <div class="hint">💡 Ketuk kartu untuk detail Kanji</div>
      </div>

      <div class="controls">
        <button onclick="prevKanji()" class="action-btn btn-blue">◀ Kiri</button>
        <span id="kj-counter" style="font-size:12px; font-weight:bold;">1 / 10</span>
        <button onclick="nextKanji()" class="action-btn btn-blue">Kanan ▶</button>
      </div>
    </div>


    <!-- BUNPOU TAB -->
    <div id="tab-bunpou" class="tab-content">
      <div class="card">
        <input type="text" id="bunpou-search" oninput="searchBunpou()" placeholder="🔍 Cari tata bahasa...">
      </div>
      <div id="bunpou-list"></div>
    </div>


    <!-- KUIS TAB -->
    <div id="tab-kuis" class="tab-content">
      <div id="quiz-start" class="card" style="text-align: center;">
        <h3 style="margin-bottom: 8px;">🎯 Pilih Kuis</h3>
        <button onclick="startQuiz('kotoba')" class="action-btn btn-pink" style="width:100%; margin-bottom:8px;">Kuis Kotoba</button>
        <button onclick="startQuiz('kanji')" class="action-btn btn-blue" style="width:100%; margin-bottom:8px;">Kuis Kanji N4</button>
        <button onclick="startQuiz('bunpou')" class="action-btn btn-mint" style="width:100%; margin-bottom:8px;">Kuis Bunpou</button>
      </div>

      <div id="quiz-box" class="card hidden">
        <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:10px;">
          <span id="q-category" style="font-weight:bold; color:#A287F4;">Kotoba</span>
          <span id="q-progress">1 / 5</span>
        </div>
        <h4 id="q-question" style="font-size:16px; margin-bottom:12px;">Pertanyaan</h4>
        <div id="q-options"></div>
        <div id="q-feedback" style="font-size:12px; margin:10px 0; padding:8px; border-radius:8px;" class="hidden"></div>
        <button id="q-next-btn" onclick="nextQuestion()" class="action-btn btn-lavender" style="width:100%; margin-top:10px;" disabled>Selanjutnya ▶</button>
      </div>

      <div id="quiz-result" class="card hidden" style="text-align:center;">
        <h3>🏆 Kuis Selesai!</h3>
        <p style="font-size:24px; font-weight:bold; color:#A287F4; margin: 10px 0;" id="q-score">80%</p>
        <button onclick="resetQuiz()" class="action-btn btn-lavender" style="width:100%;">Coba Lagi</button>
      </div>
    </div>

  </main>

  <script>
    // Data Kotoba
    const kotobaData = [
      { bab: 26, kanji: "診ます", kana: "みます", arti: "memeriksa kesehatan", contoh: "医者に診てもらいます" },
      { bab: 26, kanji: "探します", kana: "さがします", arti: "mencari barang hilang", contoh: "鍵を探しています" },
      { bab: 27, kanji: "飼います", kana: "かいます", arti: "memelihara hewan", contoh: "犬を飼っています" },
      { bab: 28, kanji: "売れます", kana: "うれます", arti: "terjual, laku", contoh: "パンがよく売れます" }
    ];

    // Data Kanji
    const kanjiData = [
      { char: "新", strokes: "13 Coretan", arti: "Baru", onyomi: "シン", kunyomi: "あたら.しい", ex: "新聞 (しんぶん) - Koran" },
      { char: "古", strokes: "5 Coretan", arti: "Lama / Kuno", onyomi: "コ", kunyomi: "ふる.i", ex: "中古 (ちゅうこ) - Barang Bekas" }
    ];

    // Data Bunpou
    const bunpouData = [
      { bab: 26, pola: "〜んですか / 〜んです", penjelasan: "Meminta atau menjelaskan alasan latar belakang.", contoh: "どうして遅れたんですか。" },
      { bab: 27, pola: "Kata Kerja Form Potensial", penjelasan: "Menyatakan kemampuan (Bisa / Dapat).", contoh: "日本語が話せます。" }
    ];

    // Data Quiz
    const quizData = [
      { category: "Kotoba", question: "Apa arti '診ます (みます)'?", options: ["Memeriksa kesehatan", "Mencari barang", "Membeli", "Menjual"], answer: 0, exp: "診ます berarti memeriksa kesehatan ke dokter." },
      { category: "Kanji N4", question: "Onyomi dari Kanji '新' adalah...", options: ["コ", "シン", "タン", "アン"], answer: 1, exp: "Onyomi 新 adalah シン (shin)." }
    ];

    let currentK = 0, currentKj = 0, currentQ = 0, score = 0;
    let selectedQ = [];

    // Init App
    window.onload = function() {
      initKotobaSelect();
      renderKotoba();
      renderKanji();
      renderBunpou(bunpouData);
    };

    // Navigation
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      document.getElementById('nav-' + tabName).classList.add('active');
    }

    // Kotoba Logic
    function initKotobaSelect() {
      let sel = document.getElementById('kotoba-select');
      sel.innerHTML = '<option value="all">Semua Bab (26-50)</option>';
      for(let i=26; i<=50; i++) sel.innerHTML += `<option value="${i}">Bab ${i}</option>`;
    }

    function renderKotoba() {
      let item = kotobaData[currentK];
      document.getElementById('k-tag').innerText = "Bab " + item.bab;
      document.getElementById('k-kanji').innerText = item.kanji;
      document.getElementById('k-kana').innerText = item.kana;
      document.getElementById('k-arti').innerText = item.arti;
      document.getElementById('k-contoh').innerText = item.contoh;
      document.getElementById('k-counter').innerText = (currentK + 1) + " / " + kotobaData.length;
      
      document.getElementById('k-front').classList.remove('hidden');
      document.getElementById('k-back').classList.add('hidden');
    }

    function toggleKotobaCard() {
      document.getElementById('k-front').classList.toggle('hidden');
      document.getElementById('k-back').classList.toggle('hidden');
    }

    function nextKotoba() { currentK = (currentK + 1) % kotobaData.length; renderKotoba(); }
    function prevKotoba() { currentK = (currentK - 1 + kotobaData.length) % kotobaData.length; renderKotoba(); }
    function filterKotoba() { currentK = 0; renderKotoba(); }

    // Kanji Logic
    function renderKanji() {
      let item = kanjiData[currentKj];
      document.getElementById('kj-strokes').innerText = item.strokes;
      document.getElementById('kj-char').innerText = item.char;
      document.getElementById('kj-arti').innerText = item.arti;
      document.getElementById('kj-onyomi').innerText = item.onyomi;
      document.getElementById('kj-kunyomi').innerText = item.kunyomi;
      document.getElementById('kj-ex').innerText = item.ex;
      document.getElementById('kj-counter').innerText = (currentKj + 1) + " / " + kanjiData.length;

      document.getElementById('kj-front').classList.remove('hidden');
      document.getElementById('kj-back').classList.add('hidden');
    }

    function toggleKanjiCard() {
      document.getElementById('kj-front').classList.toggle('hidden');
      document.getElementById('kj-back').classList.toggle('hidden');
    }

    function nextKanji() { currentKj = (currentKj + 1) % kanjiData.length; renderKanji(); }
    function prevKanji() { currentKj = (currentKj - 1 + kanjiData.length) % kanjiData.length; renderKanji(); }

    // Bunpou Logic
    function renderBunpou(data) {
      let list = document.getElementById('bunpou-list');
      list.innerHTML = '';
      data.forEach(item => {
        list.innerHTML += `
          <div class="card" style="border-left: 4px solid #BFFCC6;">
            <span style="font-size:10px; background:#BFFCC6; padding:2px 6px; border-radius:10px; font-weight:bold;">Bab ${item.bab}</span>
            <h4 style="margin:6px 0;">${item.pola}</h4>
            <p style="font-size:12px; color:#555;">${item.penjelasan}</p>
            <p style="font-size:11px; color:#888; margin-top:4px;"><i>Contoh: ${item.contoh}</i></p>
          </div>
        `;
      });
    }

    function searchBunpou() {
      let q = document.getElementById('bunpou-search').value.toLowerCase();
      let res = bunpouData.filter(b => b.pola.toLowerCase().includes(q) || b.penjelasan.toLowerCase().includes(q));
      renderBunpou(res);
    }

    // Quiz Logic
    function startQuiz(cat) {
      selectedQ = quizData;
      currentQ = 0; score = 0;
      document.getElementById('quiz-start').classList.add('hidden');
      document.getElementById('quiz-box').classList.remove('hidden');
      renderQuiz();
    }

    function renderQuiz() {
      let q = selectedQ[currentQ];
      document.getElementById('q-category').innerText = q.category;
      document.getElementById('q-progress').innerText = (currentQ + 1) + " / " + selectedQ.length;
      document.getElementById('q-question').innerText = q.question;
      
      let optDiv = document.getElementById('q-options');
      optDiv.innerHTML = '';
      q.options.forEach((opt, idx) => {
        optDiv.innerHTML += `<button class="option-btn" onclick="checkAnswer(${idx}, this)">${opt}</button>`;
      });

      document.getElementById('q-feedback').classList.add('hidden');
      document.getElementById('q-next-btn').disabled = true;
    }

    function checkAnswer(idx, btn) {
      let q = selectedQ[currentQ];
      let allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      if(idx === q.answer) {
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('wrong');
        allBtns[q.answer].classList.add('correct');
      }

      let fb = document.getElementById('q-feedback');
      fb.innerHTML = "<b>Pembahasan:</b> " + q.exp;
      fb.classList.remove('hidden');
      
      document.getElementById('q-next-btn').disabled = false;
    }

    function nextQuestion() {
      currentQ++;
      if(currentQ < selectedQ.length) {
        renderQuiz();
      } else {
        document.getElementById('quiz-box').classList.add('hidden');
        document.getElementById('quiz-result').classList.remove('hidden');
        document.getElementById('q-score').innerText = Math.round((score / selectedQ.length) * 100) + "%";
      }
    }

    function resetQuiz() {
      document.getElementById('quiz-result').classList.add('hidden');
      document.getElementById('quiz-start').classList.remove('hidden');
    }
  </script>
</body>
</html>
